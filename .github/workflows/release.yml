name: Release

# Push a tag like v0.6.0 to publish the container image and the Helm chart to GitHub Container Registry.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image-and-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Build image (not published yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: llm-cost-guard-platform:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for vulnerabilities (blocks the release)
        # Pinned to a release published after the March 2026 trivy-action tag compromise (CVE-2026-33634).
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: llm-cost-guard-platform:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Push image (with SBOM and provenance)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
      - uses: azure/setup-helm@v5
      - name: Package and push the Helm chart (OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          version="${GITHUB_REF_NAME#v}"
          # Chart and app share the release version, so `--version X` installs app X.
          helm package charts/llm-cost-guard --version "$version" --app-version "$version"
          helm push llm-cost-guard-*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"
