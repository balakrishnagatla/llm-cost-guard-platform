apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llm-cost-guard.fullname" . }}
  labels:
    {{- include "llm-cost-guard.labels" . | nindent 4 }}
data:
  routing.json: |-
    {{- if .Values.routing }}
    {{- toPrettyJson .Values.routing | nindent 4 }}
    {{- else }}
    {{- .Files.Get "files/routing.json" | nindent 4 }}
    {{- end }}
  pricing.json: |-
    {{- if .Values.pricing }}
    {{- toPrettyJson .Values.pricing | nindent 4 }}
    {{- else }}
    {{- .Files.Get "files/pricing.json" | nindent 4 }}
    {{- end }}
