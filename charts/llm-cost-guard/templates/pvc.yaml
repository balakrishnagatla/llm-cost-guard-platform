{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "llm-cost-guard.fullname" . }}
  labels:
    {{- include "llm-cost-guard.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep  # don't lose call history on `helm uninstall`
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
