apiVersion: v1
kind: Pod
metadata:
  name: {{ include "llm-cost-guard.fullname" . }}-test-ready
  labels:
    {{- include "llm-cost-guard.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: check
      image: {{ include "llm-cost-guard.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- if or .Values.secrets.create .Values.secrets.existingSecret }}
      env:
        # /metrics needs the token when METRICS_TOKEN is set
        - name: METRICS_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "llm-cost-guard.secretName" . }}
              key: METRICS_TOKEN
              optional: true
      {{- end }}
      command:
        - python
        - -c
        - |
          import json, os, urllib.request
          base = "http://{{ include "llm-cost-guard.fullname" . }}:{{ .Values.service.port }}"
          ready = json.load(urllib.request.urlopen(base + "/health/ready", timeout=10))
          assert ready["ok"], ready
          token = os.getenv("METRICS_TOKEN", "").strip()
          req = urllib.request.Request(base + "/metrics", headers={"Authorization": f"Bearer {token}"} if token else {})
          metrics = urllib.request.urlopen(req, timeout=10).read().decode()
          assert "costguard_requests_total" in metrics or "costguard_request_duration_seconds" in metrics
          print("gateway ready, version", ready["version"])
