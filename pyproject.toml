[project]
name = "llm-cost-guard-platform"
version = "0.6.1"
description = "LLM cost gateway: per-team cost tracking, caching, model routing, budgets and failover"
requires-python = ">=3.12"
license = "MIT"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["B008", "S101", "S105", "S106", "S608", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E402"]
"scripts/demo_traffic.py" = ["S311"]  # simulated traffic, not security
"scripts/mock_provider.py" = ["S311"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 85
show_missing = true
